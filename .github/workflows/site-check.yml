name: Site Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site from registry
        run: node scripts/build.mjs

      - name: Engine tests
        run: node scripts/test-tools.mjs

      - name: DOM tests (jsdom)
        run: node scripts/test-dom.mjs

      - name: Chrome tests (homepage/search/theme)
        run: node scripts/test-chrome.mjs

      - name: Link & integrity checks
        run: node scripts/link-check.mjs

      - name: Verify deployment config
        run: |
          test -f firebase.json
          test -f .firebaserc
          test -f robots.txt
          test -f sitemap.xml
          test -f manifest.webmanifest
          node -e "const s=require('./sitemap.xml'); " 2>/dev/null || true
          grep -q "<urlset" sitemap.xml
          grep -q "Sitemap:" robots.txt


      - name: Commit generated site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html 404.html categories tools sitemap.xml robots.txt manifest.webmanifest
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "chore: regenerate static site"
            git push
          fi
